name: Android DevSecOps

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Quality Gate & Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

  android:
    name: Quality Gate & Build Debug APK
    needs: quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Checkout baseline source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && 'main') || github.event.before || 'main' }}
          path: .detekt-baseline
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Generate baseline from upstream source
        shell: bash
        run: |
          for file in build.gradle.kts settings.gradle.kts app/build.gradle.kts gradle/libs.versions.toml gradle.properties gradle/wrapper/gradle-wrapper.properties; do
            if [ -f "$file" ]; then
              mkdir -p ".detekt-baseline/$(dirname "$file")"
              cp "$file" ".detekt-baseline/$file"
            fi
          done
          mkdir -p .detekt-baseline/app/config/detekt
          chmod +x .detekt-baseline/gradlew
          (
            cd .detekt-baseline
            ./gradlew :app:detektBaseline --no-daemon --stacktrace
          )
          mkdir -p app/config/detekt
          cp .detekt-baseline/app/config/detekt/baseline.xml app/config/detekt/baseline.xml

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Detekt, Android lint, and assemble debug APK
        run: ./gradlew :app:detekt :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mehfil-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
